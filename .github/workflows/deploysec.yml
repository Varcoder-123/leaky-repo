name: DevSecOps Pipeline

on:
  push:
    branches:
      - master

jobs:

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
	run: |
	pwd
    	ls -la
    	gitleaks dir ./leaky-repo --redact --verbose
